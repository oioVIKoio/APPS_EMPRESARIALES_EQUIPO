{% extends 'clientes/base.html' %}

{% block title %}Confirmar eliminación{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body text-center p-5">
                <div class="mb-3">
                    <span class="display-4 text-danger">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                    </span>
                </div>
                <h4 class="mb-3">¿Confirmas la eliminación de {{ cliente.nombre }} {{ cliente.apellido }}?</h4>
                <p class="text-muted">Esta acción no se puede deshacer.</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <a href="{% url 'cliente_list' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
