{% extends 'clientes/base.html' %}

{% block title %}Eliminar Favorito{% endblock %}

{% block content %}
    <div class="mx-auto" style="max-width: 500px;">
        <div class="card shadow-lg border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">Confirmar Eliminación</h4>
            </div>
            <div class="card-body p-4 text-center">
                <p class="fs-5">¿Deseas quitar el producto <strong>{{ favorito.producto.nombre }}</strong> de la lista de favoritos de <strong>{{ favorito.cliente.nombre }}</strong>?</p>
                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger me-2">Sí, Eliminar</button>
                    <a href="{% url 'cliente_favoritos_list' favorito.cliente.pk %}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
{% endblock %}
