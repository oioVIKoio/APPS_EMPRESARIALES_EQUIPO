{% extends 'ventas/crud/formulario.html' %}

{% block titulo_pagina %}Nuevo cupón{% endblock %}

{% block titulo %}Nuevo cupón{% endblock %}

{% block url_lista %}
    {% url 'ventas:lista_cupones' %}
{% endblock %}

{% block formulario %}

<div class="mb-3">
    <label class="form-label">Código</label>
    <input
        type="text"
        name="codigo"
        class="form-control"
        required
    >
</div>

<div class="mb-3">
    <label class="form-label">Descripción</label>
    <input
        type="text"
        name="descripcion"
        class="form-control"
    >
</div>

<div class="mb-3">
    <label class="form-label">Descuento (%)</label>
    <input
        type="number"
        name="descuento"
        class="form-control"
        step="0.01"
        min="0"
        max="100"
        required
    >
</div>

<div class="row">
    <div class="col-md-6 mb-3">
        <label class="form-label">Fecha inicio</label>
        <input
            type="date"
            name="fecha_inicio"
            class="form-control"
            required
        >
    </div>

    <div class="col-md-6 mb-3">
        <label class="form-label">Fecha fin</label>
        <input
            type="date"
            name="fecha_fin"
            class="form-control"
            required
        >
    </div>
</div>

<div class="form-check mb-3">
    <input
        type="checkbox"
        name="activo"
        class="form-check-input"
        id="activo"
        checked
    >
    <label class="form-check-label" for="activo">
        Activo
    </label>
</div>

{% endblock %}
