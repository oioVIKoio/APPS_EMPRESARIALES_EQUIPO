{% extends 'ventas/crud/formulario.html' %}

{% block titulo_pagina %}Editar pedido{% endblock %}

{% block titulo %}Editar pedido{% endblock %}

{% block url_lista %}
    {% url 'ventas:lista_pedidos' %}
{% endblock %}

{% block formulario %}

<div class="mb-3">
    <label class="form-label">Cliente</label>
    <select name="cliente" class="form-select" required>
        {% for cliente in clientes %}
            <option
                value="{{ cliente.id_cliente }}"
                {% if cliente.id_cliente == pedido.cliente_id %}selected{% endif %}
            >
                {{ cliente }}
            </option>
        {% endfor %}
    </select>
</div>

<div class="mb-3">
    <label class="form-label">Estado</label>
    <select name="estado" class="form-select">
        {% for opcion in opciones_estado %}
            <option
                value="{{ opcion }}"
                {% if opcion == pedido.estado %}selected{% endif %}
            >
                {{ opcion }}
            </option>
        {% endfor %}
    </select>
</div>

<div class="mb-3">
    <label class="form-label">Total</label>
    <input
        type="number"
        name="total"
        class="form-control"
        step="0.01"
        min="0"
        value="{{ pedido.total }}"
        required
    >
</div>

{% endblock %}
