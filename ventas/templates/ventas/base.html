<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Tienda Online{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #f5f7fa;
        }

        main {
            flex: 1;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 1030;
            background: #17202a;
        }

        .navbar-brand {
            letter-spacing: .3px;
        }

        .nav-link {
            color: #adb5bd !important;
        }

        .nav-link:hover,
        .nav-link.active {
            color: #fff !important;
        }

        .page-container {
            padding-top: 2.5rem;
            padding-bottom: 3rem;
        }

        .card {
            border: 0;
            border-radius: 14px;
        }

        footer {
            background: #17202a;
            color: #adb5bd;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
    <div class="container">

        <a
            class="navbar-brand fw-semibold"
            href="{% url 'catalogo:inicio' %}"
        >
            Tienda Online
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNaVentas"
            aria-controls="navbarNaVentas"
            aria-expanded="false"
            aria-label="Abrir navegación"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNaVentas">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'catalogo:inicio' %}">
                        Inicio
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'cliente_list' %}">
                        Clientes
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'catalogo:lista_productos' %}">
                        Productos
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'catalogo:lista_categorias' %}">
                        Categorías
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'catalogo:lista_marcas' %}">
                        Marcas
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'catalogo:lista_proveedores' %}">
                        Proveedores
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'catalogo:lista_inventarios' %}">
                        Inventario
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'ventas:inicio' %}">
                        Ventas
                    </a>
                </li>

            </ul>

        </div>
    </div>
</nav>


<main>
    <div class="container page-container">
        {% block content %}
        {% endblock %}
    </div>
</main>


<footer class="py-4">
    <div class="container text-center">
        <small>
            Sistema de gestión
        </small>
    </div>
</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
